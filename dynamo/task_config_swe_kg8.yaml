# known_good_8 source-run task config: SWE-reBench, ReAct, max_steps=20
# (mirrors the user's original frozen-trace source: Qwen3-32B, 8 prompts x
# n=8 = 64 trajectories, max_turns=20, GPU-only live rollout)
- name: swe_rebench
  sandbox:
    provider: docker
    runtime_timeout: 7200
  agent:
    name: react
    max_steps: 20
    tools:
      - name: str_replace_editor
      - name: stateful_shell
        command_timeout: 120
        env_vars:
          PAGER: "cat"
          GIT_PAGER: "cat"
          MANPAGER: "cat"
          TQDM_DISABLE: "1"
          PIP_PROGRESS_BAR: "off"
      - name: submit
    model:
      temperature: 0.8
      top_p: 0.9
      max_total_tokens: 40960
